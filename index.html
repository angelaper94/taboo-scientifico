<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taboo Scientifico</title>
<style>
:root {
  --bg:#0f172a;
  --panel:#16213f;
  --card:#fffaf0;
  --accent:#2563eb;
  --text:#f8fafc;
  --bad:#ef4444;
  --ok:#22c55e;
  --warn:#f59e0b;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:radial-gradient(circle at top,#1e3a8a 0%, var(--bg) 45%);
  color:var(--text);
  min-height:100vh;
}
.app { max-width:1200px; margin:0 auto; padding:18px; }
.top { display:flex; gap:16px; align-items:stretch; justify-content:space-between; margin-bottom:16px; }
.panel {
  background:rgba(15,23,42,.86);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:16px;
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}
.team { flex:1; text-align:center; transition:.2s; }
.team.active { outline:4px solid var(--accent); transform:scale(1.02); }
.team input {
  width:100%; background:transparent; color:var(--text); border:0;
  border-bottom:1px solid rgba(255,255,255,.35);
  font-size:24px; text-align:center; font-weight:800;
}
.score { font-size:58px; font-weight:900; line-height:1; margin-top:8px; }
.center { flex:.9; text-align:center; }
.title { font-size:28px; font-weight:900; letter-spacing:.04em; }
.turn { font-size:20px; opacity:.9; margin-top:6px; }
.timer { font-size:84px; font-weight:1000; line-height:1; margin-top:10px; }
.progress { height:12px; background:rgba(255,255,255,.18); border-radius:999px; overflow:hidden; margin-top:8px; }
.progress > div { height:100%; width:100%; background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444); transition:width .2s linear; }
.card-wrap { display:grid; grid-template-columns:1fr 320px; gap:16px; align-items:stretch; }
.card {
  min-height:500px;
  background:var(--card);
  color:#111827;
  border-radius:28px;
  padding:28px;
  text-align:center;
  border:12px solid #1d4ed8;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 28px 80px rgba(0,0,0,.35);
}
.cover-screen {
  min-height:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.cover-icon { font-size:86px; line-height:1; }
.cover-title { color:#1d4ed8; font-size:clamp(38px,6vw,76px); font-weight:1000; line-height:1; text-transform:uppercase; }
.cover-subtitle { color:#475569; font-size:24px; font-weight:850; }
.card-content { display:none; width:100%; animation:fadeIn .25s ease; }
.card-content.visible { display:block; }
.label { color:#1d4ed8; font-weight:900; letter-spacing:.18em; font-size:18px; }
.word {
    font-size: clamp(28px, 6vw, 52px);
    font-weight: bold;
    margin-bottom: 25px;
    color: #dc2626;
    text-transform: uppercase;

    overflow-wrap: break-word;
    word-break: break-word;
    hyphens: auto;

    line-height: 1.1;
}

.taboo {
    list-style: none;
    padding: 0;
    margin: 0;

    font-size: clamp(18px, 4.5vw, 30px);
    font-weight: bold;

    line-height: 1.35;

    overflow-wrap: break-word;
    word-break: break-word;
}
.taboo-title { color:#7f1d1d; font-weight:1000; font-size:22px; margin-bottom:10px; letter-spacing:.12em; }
.taboo-list { display:grid; grid-template-columns:1fr; gap:10px; max-width:520px; margin:0 auto; }
.taboo-item { font-size:32px; font-weight:900; color:#7f1d1d; border-top:2px dashed rgba(127,29,29,.25); padding-top:8px; }
.controls { display:flex; flex-direction:column; gap:10px; }
button { border:0; border-radius:16px; padding:16px 18px; font-size:18px; font-weight:900; cursor:pointer; color:white; background:#334155; box-shadow:0 8px 20px rgba(0,0,0,.22); }
button:hover { filter:brightness(1.1); }
button:disabled { opacity:.45; cursor:not-allowed; filter:none; }
.ok { background:var(--ok); } .bad { background:var(--bad); } .warn { background:var(--warn); } .blue { background:var(--accent); }
.small { font-size:14px; opacity:.85; line-height:1.35; }
.settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
.settings label { font-size:14px; opacity:.85; text-align:left; }
.settings input { width:100%; border-radius:10px; border:0; padding:10px; font-weight:800; }
.log { max-height:190px; overflow:auto; text-align:left; font-size:13px; line-height:1.35; }
@keyframes fadeIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
@media (max-width: 600px) {

  body {
    overflow-x: hidden;
  }

  header {
    padding: 10px;
  }

  h1 {
    font-size: 26px;
  }

  #turno {
    font-size: 20px;
  }

  .scoreboard {
    font-size: 18px;
    flex-direction: row;
    gap: 8px;
    margin: 10px auto;
  }

  .timer {
    font-size: 48px;
    margin: 8px;
  }

  .card {
    width: calc(100vw - 28px);
    max-width: none;
    min-height: 360px;
    padding: 18px;
    margin: 10px auto;
    box-sizing: border-box;
  }

  #coverScreen {
    font-size: 24px;
    line-height: 1.3;
  }

  .word {
    font-size: clamp(30px, 9vw, 42px);
    line-height: 1.05;
    margin-bottom: 18px;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .taboo {
    font-size: clamp(20px, 6vw, 28px);
    line-height: 1.25;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px;
  }

  button {
    width: 100%;
    margin: 0;
    font-size: 16px;
    padding: 13px 8px;
    border-radius: 10px;
  }

  .start {
    grid-column: span 2;
  }

  .end {
    grid-column: span 2;
  }
}
@media print { body { background:white; color:black; } .controls,.settings { display:none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="panel team active" id="panelA"><input id="nameA" value="Squadra A" /><div class="score" id="scoreA">0</div></div>
    <div class="panel center">
      <div class="title">TABOO SCIENTIFICO</div>
      <div class="turn" id="turnText">Turno: Squadra A</div>
      <div class="timer" id="timer">60</div>
      <div class="progress"><div id="bar"></div></div>
      <div class="settings">
        <label>Secondi per turno<input id="seconds" type="number" min="10" max="300" value="60"></label>
        <label>Punti vittoria<input id="target" type="number" min="1" max="999" value="30"></label>
      </div>
    </div>
    <div class="panel team" id="panelB"><input id="nameB" value="Squadra B" /><div class="score" id="scoreB">0</div></div>
  </div>

  <div class="card-wrap">
    <div class="card">
      <div class="cover-screen" id="coverScreen">
        <div class="cover-subtitle">Premi “Avvia turno” per iniziare</div>
      </div>
      <div class="card-content" id="cardContent">
        <div class="label">PAROLA DA INDOVINARE</div>
        <div class="word" id="word">---</div>
        <div class="taboo-title">NON DIRE</div>
        <div class="taboo-list" id="tabooList"></div>
      </div>
    </div>
    <div class="panel controls">
      <button class="blue" id="startBtn" onclick="startTurn()">▶ Avvia turno</button>
      <button class="ok" id="correctBtn" onclick="correct()">✓ Indovinata (+1)</button>
      <button class="warn" id="skipBtn" onclick="skip()">↷ Salta</button>
      <button class="bad" id="tabooBtn" onclick="tabooPenalty()">✕ Taboo pronunciata (-1)</button>
      <button id="endBtn" onclick="endTurn()">⏭ Fine turno</button>
      <button onclick="undo()">↩ Annulla ultima azione</button>
      <button onclick="resetGame()">🔄 Nuova partita</button>
      <div class="small" id="deckInfo"></div>
      <hr style="width:100%;border-color:rgba(255,255,255,.15)">
      <div class="small"><b>Comandi rapidi:</b><br>Spazio = avvia/pausa · Freccia destra = indovinata · Freccia giù = salta · Freccia sinistra = taboo · Invio = fine turno</div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

let state = { team:'A', scoreA:0, scoreB:0, used:[], current:null, running:false, remaining:60, revealed:false, history:[], log:[] };
let interval = null;
function $(id) { return document.getElementById(id); }
function names() { return {A:$('nameA').value || 'Squadra A', B:$('nameB').value || 'Squadra B'}; }
function save() { localStorage.setItem('tabooScientificoStateCovered', JSON.stringify(state)); }
function load() {
  try {
    const s=JSON.parse(localStorage.getItem('tabooScientificoStateCovered'));
    if(s && Array.isArray(s.used)) state={...state,...s, revealed:false, running:false, current:null};
  } catch(e){}
}
function availableCards() { return CARDS.filter((_,i)=>!state.used.includes(i)); }
function setControls() {
  $('startBtn').disabled = state.running;
  $('correctBtn').disabled = !state.revealed;
  $('skipBtn').disabled = !state.revealed;
  $('tabooBtn').disabled = !state.revealed;
  $('endBtn').disabled = !state.revealed && !state.running;
}
function drawCard() {
  const idxs = CARDS.map((_,i)=>i).filter(i=>!state.used.includes(i));
  if(!idxs.length) { alert('Mazzo finito. Vince chi ha più punti!'); return; }
  const idx = idxs[Math.floor(Math.random()*idxs.length)];
  state.current = idx;
  state.used.push(idx);
}
function hideCard() {
  state.revealed = false;
  $('coverScreen').style.display = 'flex';
  $('cardContent').classList.remove('visible');
  $('word').textContent = '---';
  $('tabooList').innerHTML = '';
}
function revealCurrentCard() {
  const card=CARDS[state.current];
  if(!card) return;
  $('coverScreen').style.display = 'none';
  $('cardContent').classList.add('visible');
  $('word').textContent=card.word;
  $('tabooList').innerHTML=card.taboo.map(t=>`<div class="taboo-item">${t}</div>`).join('');
}
function render() {
  const n=names();
  $('scoreA').textContent=state.scoreA; $('scoreB').textContent=state.scoreB;
  $('panelA').classList.toggle('active', state.team==='A'); $('panelB').classList.toggle('active', state.team==='B');
  $('turnText').textContent='Turno: '+(state.team==='A'?n.A:n.B);
  $('timer').textContent=state.remaining;
  const total=Number($('seconds').value)||60;
  $('bar').style.width=Math.max(0,Math.min(100,state.remaining/total*100))+'%';
  if(state.revealed) revealCurrentCard(); else hideCard();
  $('deckInfo').innerHTML = `<b>Carte:</b> ${state.used.length} usate / ${CARDS.length} totali<br><b>Rimaste:</b> ${availableCards().length}`;
  $('log').innerHTML = state.log.slice(-12).reverse().map(x=>`<div>• ${x}</div>`).join('');
  setControls();
}
function addLog(text) { state.log.push(text); if(state.log.length>80) state.log.shift(); }
function snapshot() {
  state.history.push(JSON.stringify({scoreA:state.scoreA,scoreB:state.scoreB,used:state.used,current:state.current,team:state.team,remaining:state.remaining,revealed:state.revealed,log:state.log}));
  if(state.history.length>30) state.history.shift();
}
function startTurn() {
  if(state.running) return;
  clearInterval(interval);
  state.running=true;
  state.revealed=true;
  state.remaining=Number($('seconds').value)||60;
  if(state.current===null) drawCard();
  tickStart();
  save();
  render();
}
function tickStart() {
  clearInterval(interval);
  interval=setInterval(()=>{
    state.remaining--;
    if(state.remaining<=0) endTurn();
    save(); render();
  },1000);
}
function endTurn() {
  clearInterval(interval);
  interval=null;
  if(state.revealed || state.running) addLog('Cambio turno');
  state.running=false;
  state.revealed=false;
  state.remaining=Number($('seconds').value)||60;
  state.current=null;
  state.team=state.team==='A'?'B':'A';
  save(); render();
}
function point(delta, label) {
  if(!state.revealed) return;
  snapshot();
  const card=CARDS[state.current];
  if(state.team==='A') state.scoreA += delta; else state.scoreB += delta;
  addLog(`${state.team}: ${label} - ${card ? card.word : ''}`);
  const target=Number($('target').value)||30;
  if(state.scoreA>=target || state.scoreB>=target) setTimeout(()=>alert('Partita finita! Vince '+(state.scoreA>state.scoreB?names().A:names().B)),50);
  drawCard(); save(); render();
}
function correct() { point(1,'indovinata'); }
function tabooPenalty() { point(-1,'taboo'); }
function skip() {
  if(!state.revealed) return;
  snapshot();
  const card=CARDS[state.current];
  addLog(`${state.team}: saltata - ${card ? card.word : ''}`);
  drawCard(); save(); render();
}
function undo() {
  const last=state.history.pop();
  if(!last) return;
  const restored=JSON.parse(last);
  state={...state,...restored};
  if(state.revealed) state.running=true;
  save(); render();
}
function resetGame() {
  if(!confirm('Azzerare partita, punteggi e carte usate?')) return;
  clearInterval(interval);
  interval=null;
  state={ team:'A', scoreA:0, scoreB:0, used:[], current:null, running:false, remaining:Number($('seconds').value)||60, revealed:false, history:[], log:[] };
  save(); render();
}
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space') { e.preventDefault(); if(state.running) { clearInterval(interval); state.running=false; } else { startTurn(); } render(); }
  if(e.key==='ArrowRight') correct();
  if(e.key==='ArrowDown') skip();
  if(e.key==='ArrowLeft') tabooPenalty();
  if(e.key==='Enter') endTurn();
});
$('seconds').addEventListener('change',()=>{ if(!state.running) { state.remaining=Number($('seconds').value)||60; render(); save(); } });
load(); render();
</script>
